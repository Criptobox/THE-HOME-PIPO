<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1917" />
      <stop offset="50%" stop-color="#0F0E0D" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="fireGrad512" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="40%" stop-color="#ea580c" />
      <stop offset="80%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="crustGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="cheeseGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <filter id="volcanoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad512)" />
  <rect x="6" y="6" width="500" height="500" rx="104" fill="none" stroke="#ea580c" stroke-width="6" stroke-opacity="0.75" />

  <!-- Volcanic Glow Effect -->
  <circle cx="256" cy="240" r="160" fill="#ea580c" opacity="0.22" filter="url(#volcanoGlow)" />

  <!-- Pizza Slice Art scaled -->
  <g transform="translate(48, 30)">
    <!-- Pizza Slice Crust -->
    <path d="M 208 40 Q 75 125 35 285 L 208 385 L 380 285 Q 340 125 208 40 Z" fill="url(#crustGrad512)" stroke="#92400e" stroke-width="6" />
    
    <!-- Cheese Layer -->
    <path d="M 208 60 Q 95 135 60 275 L 208 365 L 355 275 Q 320 135 208 60 Z" fill="url(#cheeseGrad512)" />

    <!-- Melted sauce accents -->
    <path d="M 90 260 Q 145 300 208 285 Q 275 300 325 260" fill="none" stroke="#dc2626" stroke-width="10" stroke-linecap="round" />

    <!-- Pepperonis -->
    <circle cx="155" cy="170" r="32" fill="#b91c1c" stroke="#991b1b" stroke-width="4" />
    <circle cx="160" cy="164" r="8" fill="#ef4444" opacity="0.85" />

    <circle cx="255" cy="188" r="35" fill="#b91c1c" stroke="#991b1b" stroke-width="4" />
    <circle cx="260" cy="182" r="9" fill="#ef4444" opacity="0.85" />

    <circle cx="204" cy="275" r="30" fill="#b91c1c" stroke="#991b1b" stroke-width="4" />
    <circle cx="208" cy="270" r="7" fill="#ef4444" opacity="0.85" />

    <!-- Basil Leaves -->
    <path d="M 198 130 Q 224 110 224 135 Q 224 155 198 130 Z" fill="#15803d" />
    <path d="M 275 250 Q 300 230 300 255 Q 300 275 275 250 Z" fill="#15803d" />
    <path d="M 125 220 Q 145 205 145 225 Q 145 240 125 220 Z" fill="#15803d" />

    <!-- Flame icon -->
    <path d="M 208 5 C 180 30 170 58 195 78 C 215 62 224 40 208 5 Z" fill="url(#fireGrad512)" />
  </g>

  <!-- Typography -->
  <text x="256" y="445" text-anchor="middle" fill="#FFFFFF" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="900" font-size="44" letter-spacing="6">THE HOME PIPO</text>
  <text x="256" y="478" text-anchor="middle" fill="#ea580c" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="700" font-size="18" letter-spacing="4">PIZZERÍA ARTESANAL</text>
</svg>

    <script type="module" crossorigin src="./assets/index-DVurhGC5.js"></script>

  </head>
  <body class="bg-[#0F0E0D] text-stone-100 antialiased selection:bg-orange-500 selection:text-white">
    <div id="root"></div>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((registration) => {
              console.log('[THE HOME PIPO] Service Worker registrado con alcance:', registration.scope);
              
              // Handle updates smoothly
              registration.onupdatefound = () => {
                const installingWorker = registration.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = () => {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('[THE HOME PIPO] Nueva versión disponible en caché');
                    }
                  };
                }
              };
            })
            .catch((err) => {
              console.warn('[THE HOME PIPO] Error al registrar Service Worker:', err);
            });
        });
      }
    </script>
  </body>
</html>

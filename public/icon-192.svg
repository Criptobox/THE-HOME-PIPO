<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1917" />
      <stop offset="50%" stop-color="#0F0E0D" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="40%" stop-color="#ea580c" />
      <stop offset="80%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="crustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="cheeseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
  </defs>

  <!-- Background with subtle volcanic border -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="188" height="188" rx="40" fill="none" stroke="#ea580c" stroke-width="3" stroke-opacity="0.6" />

  <!-- Volcanic Glow Effect -->
  <circle cx="96" cy="96" r="60" fill="#ea580c" opacity="0.18" filter="blur(16px)" />

  <!-- Pizza Slice Art -->
  <g transform="translate(16, 12)">
    <!-- Pizza Slice Crust -->
    <path d="M 80 18 Q 30 50 15 110 L 80 148 L 145 110 Q 130 50 80 18 Z" fill="url(#crustGrad)" stroke="#92400e" stroke-width="2" />
    
    <!-- Cheese Layer -->
    <path d="M 80 26 Q 38 54 25 106 L 80 140 L 135 106 Q 122 54 80 26 Z" fill="url(#cheeseGrad)" />

    <!-- Sauce drips / Melted Cheese accents -->
    <path d="M 35 100 Q 55 115 80 110 Q 105 115 125 100" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round" />

    <!-- Pepperonis with shadows -->
    <circle cx="60" cy="65" r="12" fill="#b91c1c" stroke="#991b1b" stroke-width="2" />
    <circle cx="62" cy="63" r="3" fill="#ef4444" opacity="0.8" />

    <circle cx="98" cy="72" r="13" fill="#b91c1c" stroke="#991b1b" stroke-width="2" />
    <circle cx="100" cy="70" r="3.5" fill="#ef4444" opacity="0.8" />

    <circle cx="78" cy="105" r="11" fill="#b91c1c" stroke="#991b1b" stroke-width="2" />
    <circle cx="80" cy="103" r="3" fill="#ef4444" opacity="0.8" />

    <!-- Basil Leaves -->
    <path d="M 76 50 Q 86 42 86 52 Q 86 60 76 50 Z" fill="#15803d" />
    <path d="M 105 95 Q 115 87 115 97 Q 115 105 105 95 Z" fill="#15803d" />
    <path d="M 48 85 Q 56 80 56 88 Q 56 94 48 85 Z" fill="#15803d" />

    <!-- Flame icon rising from top -->
    <path d="M 80 2 C 70 12 66 22 75 30 C 83 24 86 16 80 2 Z" fill="url(#fireGrad)" />
  </g>

  <!-- Text PIPO -->
  <text x="96" y="174" text-anchor="middle" fill="#FFFFFF" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="900" font-size="20" letter-spacing="3">PIPO</text>
</svg>
